name: Bug report / problem
description: Something is not working, or a reading is wrong or missing
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Rig LEDs version
      description: Shown on the System tab in Settings, for example 1.1.3.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "In Rig LEDs, open Settings, go to the System tab and press Copy under Diagnostics. Paste it here. It lists your hardware and what could or could not be read."
      render: text
    validations:
      required: false
